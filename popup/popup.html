<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Know Ur Limit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="#38bdf8"/>
            <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Know Ur Limit</h1>
          <span class="subtext" id="headerStatusText">Live Usage & Token Telemetry</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="icon-btn" title="Fetch real usage & remaining tokens from all chatbots">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        <button id="optionsBtn" class="icon-btn" title="Settings & Activity Log">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Global Notice Banner for Providers Requiring Login -->
    <div id="loginWarningBanner" class="login-warning-banner hidden"></div>

    <!-- Real Telemetry Overview Bar -->
    <div class="stats-overview">
      <div class="stat-item">
        <span class="stat-label">Total Tokens Used</span>
        <span class="stat-value" id="statTotalUsed" style="color: #f59e0b;">--</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Remaining Tokens</span>
        <span class="stat-value" id="statTotalPending" style="color: #10b981;">--</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Synced Bots</span>
        <span class="stat-value" id="statLimitedBots">0 / 4</span>
      </div>
    </div>

    <!-- Bots Cards List -->
    <main class="bots-grid" id="botsGrid">
      <!-- Dynamically Rendered Real Telemetry Bot Cards -->
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="pulse-dot"></span>
        <span class="footer-text">Direct Provider API & Token Sync</span>
      </div>
      <div class="footer-right">
        <button id="syncAllFooterBtn" class="link-btn">Sync All Bots</button>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
